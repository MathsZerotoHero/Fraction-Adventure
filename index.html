<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B6CF6">
<meta name="description" content="Fraction Adventure — an interactive Year 4 (KSSR) fractions learning app in English and Bahasa Melayu.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fractions">
<title>Fraction Adventure · Pengembaraan Pecahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➗</text></svg>">
<style>
/* ============ Fraction Adventure — styles ============ */
:root{
  --ink:#20214A;
  --ink-soft:#5A5C86;
  --paper:#F3F5FC;
  --card:#FFFFFF;
  --blueberry:#5B6CF6;
  --mint:#16B79A;
  --mango:#FF9F1C;
  --melon:#FF5D6C;
  --grape:#9B5DE5;
  --line:#20214A;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;
  --shadow:4px 4px 0 var(--line);
  --shadow-sm:3px 3px 0 var(--line);
  --shadow-lg:6px 6px 0 var(--line);
  --font:"Nunito","Segoe UI Rounded","Trebuchet MS",system-ui,-apple-system,sans-serif;
  --display:"Baloo 2","Nunito","Segoe UI Rounded",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--paper);
  background-image:radial-gradient(circle at 12% 8%,rgba(91,108,246,.10),transparent 42%),
                   radial-gradient(circle at 88% 4%,rgba(255,159,28,.12),transparent 40%),
                   radial-gradient(circle at 50% 100%,rgba(22,183,154,.10),transparent 45%);
  background-attachment:fixed;
  color:var(--ink);
  font-size:17px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(1.6rem,5vw,2.3rem);letter-spacing:-.01em}
h2{font-size:clamp(1.25rem,3.6vw,1.65rem)}
h3{font-size:1.1rem}
p{margin:0 0 .8em;max-width:68ch}
button{font-family:inherit;font-size:1rem;cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px;border-radius:6px}
.hidden{display:none !important}

/* ---- layout ---- */
.wrap{max-width:940px;margin:0 auto;padding:0 16px 96px}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(243,245,252,.92);
  backdrop-filter:blur(8px);
  border-bottom:3px solid var(--line);
}
.topbar-in{max-width:940px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.brand .logo{
  width:34px;height:34px;border:3px solid var(--line);border-radius:9px;
  display:grid;place-items:center;background:var(--mango);font-weight:800;font-size:.8rem;
  box-shadow:var(--shadow-sm);flex:none
}
.spacer{flex:1}
.lang{display:flex;border:3px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;box-shadow:var(--shadow-sm)}
.lang button{border:0;background:transparent;padding:5px 12px;font-weight:700;font-size:.8rem;color:var(--ink-soft)}
.lang button.on{background:var(--blueberry);color:#fff}
.starcount{
  display:flex;align-items:center;gap:5px;font-weight:800;background:#fff;
  border:3px solid var(--line);border-radius:999px;padding:3px 12px;box-shadow:var(--shadow-sm);font-size:.9rem
}

/* ---- cards & buttons ---- */
.card{
  background:var(--card);border:3px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:20px;margin:16px 0
}
.card.flat{box-shadow:none}
.btn{
  border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);
  padding:12px 18px;font-weight:800;box-shadow:var(--shadow-sm);
  transition:transform .08s ease,box-shadow .08s ease;min-height:48px
}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--blueberry);color:#fff}
.btn.go{background:var(--mint);color:#fff}
.btn.warn{background:var(--mango)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-row.end{justify-content:flex-end}

/* ---- home ---- */
.hero{
  border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  background:linear-gradient(135deg,#5B6CF6,#9B5DE5);color:#fff;padding:22px;margin:18px 0
}
.hero h1{color:#fff;margin-bottom:.15em}
.hero .sub{opacity:.92;font-weight:600;margin-bottom:14px}
.hero .btn{background:#fff}
.avatar-badge{
  width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:1.8rem;box-shadow:var(--shadow-sm);flex:none
}
.progressbar{height:18px;border:3px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--mango);transition:width .5s ease}
.hero .progressbar{background:rgba(255,255,255,.35)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.menu-tile{
  border:3px solid var(--line);border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow);
  padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px
}
.menu-tile .ico{font-size:1.7rem}
.menu-tile .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem}
.menu-tile .desc{font-size:.82rem;color:var(--ink-soft);font-weight:600}
.menu-tile.t1{background:#EEF0FF}.menu-tile.t2{background:#E7FAF5}
.menu-tile.t3{background:#FFF3E2}.menu-tile.t4{background:#FDEBEE}
.menu-tile.t5{background:#F5EBFF}

/* ---- progress map ---- */
.map{display:flex;flex-direction:column;gap:0}
.map-node{display:flex;gap:14px;align-items:stretch}
.map-rail{width:34px;display:flex;flex-direction:column;align-items:center;flex:none}
.map-dot{
  width:34px;height:34px;border-radius:50%;border:3px solid var(--line);background:#fff;
  display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none
}
.map-dot.done{background:var(--mint);color:#fff}
.map-dot.now{background:var(--mango)}
.map-dot.lock{background:#E3E5F0;color:var(--ink-soft)}
.map-line{width:4px;flex:1;background:var(--line);opacity:.25;min-height:14px}
.map-item{
  flex:1;text-align:left;border:3px solid var(--line);border-radius:var(--r-md);background:#fff;
  box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center
}
.map-item.locked{background:#F0F1F7;color:var(--ink-soft);box-shadow:none;border-style:dashed}
.map-item .ico{font-size:1.5rem;flex:none}
.map-item .mt{font-family:var(--display);font-weight:700}
.map-item .ms{font-size:.8rem;color:var(--ink-soft);font-weight:600}
.stars-mini{letter-spacing:1px;font-size:.9rem;flex:none}

/* ---- lesson ---- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.step-chip{
  border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:800;
  background:#fff;color:var(--ink-soft)
}
.step-chip.on{background:var(--grape);color:#fff}
.step-chip.done{background:var(--mint);color:#fff}
.pill{
  display:inline-block;border:2px solid var(--line);border-radius:999px;padding:2px 10px;
  font-size:.72rem;font-weight:800;background:var(--mango)
}
.callout{
  border:3px dashed var(--line);border-radius:var(--r-md);padding:14px 16px;background:#FFFDF5;margin:12px 0
}
.callout.tip{background:#EEF0FF;border-style:solid;border-color:var(--blueberry)}
.keyword{background:#FFE9A8;border-radius:5px;padding:0 4px;font-weight:800}

/* ---- fraction visuals ---- */
.fracbox{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center;margin:14px 0}
.frac{
  display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;
  font-family:var(--display);font-weight:800;vertical-align:middle
}
.frac .num{padding:0 4px}
.frac .den{padding:0 4px;border-top:3px solid currentColor}
.frac.big{font-size:2rem}
.frac.huge{font-size:2.8rem}
.mixed{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:2rem}
.part{cursor:pointer;transition:opacity .12s ease}
.part:hover{opacity:.75}
svg.shape{max-width:100%;height:auto;display:block;margin:0 auto;touch-action:manipulation}
.shape-label{text-align:center;font-weight:700;color:var(--ink-soft);font-size:.85rem;margin-top:4px}

/* ---- question ui ---- */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qdots{display:flex;gap:5px;flex-wrap:wrap}
.qdot{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);background:#fff}
.qdot.ok{background:var(--mint)}.qdot.no{background:var(--melon)}.qdot.now{background:var(--mango)}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.opt{
  border:3px solid var(--line);border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow-sm);
  padding:14px;font-weight:800;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;
  text-align:center
}
.opt.sel{background:#E7ECFF}
.opt.right{background:#D7F6EE;border-color:var(--mint)}
.opt.wrong{background:#FFE1E4;border-color:var(--melon)}
.opt.big{font-size:1.6rem;font-family:var(--display)}
.feedback{border:3px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:14px}
.feedback.ok{background:#D7F6EE}
.feedback.no{background:#FFF1DE}
.feedback h4{margin:0 0 6px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{
  width:44px;height:44px;border:3px solid var(--line);border-radius:12px;background:#fff;
  font-size:1.3rem;font-weight:800;box-shadow:var(--shadow-sm)
}
.stepper .val{min-width:46px;text-align:center;font-family:var(--display);font-size:1.5rem;font-weight:800}
.dropzones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.zone{
  border:3px dashed var(--line);border-radius:var(--r-md);min-height:110px;padding:10px;background:#fff
}
.zone.armed{background:#FFF6E2;border-color:var(--mango)}
.zone h4{text-align:center;font-size:.95rem;margin-bottom:8px}
.zone .bin{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{
  border:3px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow-sm);
  padding:8px 12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center
}
.tile.picked{background:var(--mango);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.tile.placed{opacity:.95}
.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.orderrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-end;margin:12px 0}
.ordercard{
  border:3px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);
  padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:92px
}
.ordercard.picked{background:#FFF0CC}
.mini-move{display:flex;gap:4px}
.mini-move button{width:30px;height:30px;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:800}
.groupgrid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.groupbox{
  border:3px dashed var(--line);border-radius:14px;padding:10px;min-width:88px;min-height:80px;background:#fff;
  display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;font-size:1.3rem
}
.itemtray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:1.5rem;margin:10px 0}
.item{cursor:pointer;border-radius:8px;padding:2px}
.item.used{opacity:.25}

/* ---- results ---- */
.score-ring{
  width:130px;height:130px;border-radius:50%;border:5px solid var(--line);display:grid;place-items:center;
  background:conic-gradient(var(--mint) var(--pct,0%),#E6E8F3 0);margin:0 auto 12px
}
.score-ring b{
  background:#fff;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:1.5rem;border:3px solid var(--line)
}
.tlist{list-style:none;padding:0;margin:8px 0}
.tlist li{display:flex;gap:8px;align-items:center;padding:5px 0;font-weight:700}
.bar-stat{height:12px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden;flex:1;min-width:70px}
.bar-stat i{display:block;height:100%;background:var(--blueberry)}
.badge{
  border:3px solid var(--line);border-radius:16px;padding:10px;text-align:center;background:#fff;
  box-shadow:var(--shadow-sm);font-size:.78rem;font-weight:800
}
.badge .bi{font-size:1.6rem;display:block}
.badge.off{opacity:.38;background:#F0F1F7;box-shadow:none}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}

/* ---- misc ---- */
.avatar-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:10px;margin:12px 0}
.av{
  border:3px solid var(--line);border-radius:16px;background:#fff;font-size:1.9rem;padding:8px;
  box-shadow:var(--shadow-sm)
}
.av.on{background:var(--mango);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
input[type=text]{
  border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-family:inherit;font-size:1.05rem;
  width:100%;max-width:320px;background:#fff
}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;
  box-shadow:var(--shadow-sm);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.shake{animation:shake .32s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rise{animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.starburst{font-size:3rem;text-align:center;animation:pop .45s ease}
.sticky-actions{
  position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 70%,transparent);
  padding:12px 0 16px;margin-top:10px
}
@media (max-width:560px){
  body{font-size:16px}
  .card{padding:15px;border-radius:18px}
  .wrap{padding:0 12px 90px}
  .dropzones{grid-template-columns:1fr}
  .brand span.bt{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =========================================================
   Fraction Adventure — Year 4 KSSR (Malaysia)
   Single-file app. No backend, no login.
   ========================================================= */
(function () {
"use strict";

/* ---------- storage (falls back to memory if blocked) ---------- */
var store = {
  mem: {},
  ok: (function () {
    try { window.localStorage.setItem("__fa", "1"); window.localStorage.removeItem("__fa"); return true; }
    catch (e) { return false; }
  })(),
  get: function (k) { try { return this.ok ? localStorage.getItem(k) : (this.mem[k] || null); } catch (e) { return this.mem[k] || null; } },
  set: function (k, v) { try { if (this.ok) localStorage.setItem(k, v); else this.mem[k] = v; } catch (e) { this.mem[k] = v; } },
  del: function (k) { try { if (this.ok) localStorage.removeItem(k); else delete this.mem[k]; } catch (e) { delete this.mem[k]; } }
};
var KEY = "fractionAdventure.v1";

/* ---------- app state ---------- */
var S = {
  lang: "en",
  profile: null,              // {name, avatar}
  modules: {},                // id -> {done:true, stars:0..3, best:0}
  topics: {},                 // topic -> {correct, total}
  badges: {},                 // id -> true
  stars: 0,
  finalBest: null,            // {score,total,pct}
  screen: "home"
};

function save() {
  store.set(KEY, JSON.stringify({
    lang: S.lang, profile: S.profile, modules: S.modules, topics: S.topics,
    badges: S.badges, stars: S.stars, finalBest: S.finalBest
  }));
}
function load() {
  var raw = store.get(KEY);
  if (!raw) return;
  try {
    var d = JSON.parse(raw);
    if (d && typeof d === "object") {
      S.lang = d.lang === "ms" ? "ms" : "en";
      S.profile = d.profile || null;
      S.modules = d.modules || {};
      S.topics = d.topics || {};
      S.badges = d.badges || {};
      S.stars = d.stars || 0;
      S.finalBest = d.finalBest || null;
    }
  } catch (e) { /* corrupted save: start fresh */ }
}

/* ---------- tiny helpers ---------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function el(tag, cls, html) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined && html !== null) n.innerHTML = html;
  return n;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}
function uniqPush(list, v, max) {
  if (list.length >= max) return;
  for (var i = 0; i < list.length; i++) if (list[i] === v) return;
  list.push(v);
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }

/* ---------- bilingual strings ---------- */
var STR = {
  appName:        { en: "Fraction Adventure", ms: "Pengembaraan Pecahan" },
  tagline:        { en: "Year 4 Mathematics", ms: "Matematik Tahun 4" },
  /* profile */
  welcome:        { en: "Welcome!", ms: "Selamat datang!" },
  askName:        { en: "What's your name?", ms: "Siapa nama kamu?" },
  namePh:         { en: "Type your name", ms: "Taip nama kamu" },
  pickAvatar:     { en: "Choose your character", ms: "Pilih watak kamu" },
  start:          { en: "Start my adventure", ms: "Mula pengembaraan saya" },
  needName:       { en: "Please type a name first.", ms: "Sila taip nama dahulu." },
  /* home */
  hello:          { en: "Hello, {name}!", ms: "Helo, {name}!" },
  yourProgress:   { en: "Your progress", ms: "Kemajuan kamu" },
  continueLearn:  { en: "Continue learning", ms: "Teruskan pembelajaran" },
  startLearning:  { en: "Start learning", ms: "Mula belajar" },
  allDone:        { en: "All lessons complete!", ms: "Semua pelajaran selesai!" },
  mLearn:         { en: "Learn", ms: "Belajar" },
  mLearnD:        { en: "11 lessons, step by step", ms: "11 pelajaran, langkah demi langkah" },
  mPractise:      { en: "Practise", ms: "Berlatih" },
  mPractiseD:     { en: "Train your weak topics", ms: "Latih topik yang lemah" },
  mQuiz:          { en: "Quiz", ms: "Kuiz" },
  mQuizD:         { en: "Test what you know", ms: "Uji pengetahuan kamu" },
  mLab:           { en: "Fraction Lab", ms: "Makmal Pecahan" },
  mLabD:          { en: "Build and explore fractions", ms: "Bina dan terokai pecahan" },
  mProgress:      { en: "My Progress", ms: "Kemajuan Saya" },
  mProgressD:     { en: "Stars, badges and scores", ms: "Bintang, lencana dan markah" },
  /* nav */
  back:           { en: "Back", ms: "Kembali" },
  home:           { en: "Home", ms: "Utama" },
  next:           { en: "Next", ms: "Seterusnya" },

/* =========================================================
   Visual models: bars, circles, chocolate bars, object sets
   ========================================================= */
(function () {
"use strict";
var FA = window.FA, el = FA.el;

var NS = "http://www.w3.org/2000/svg";
var INK = "#20214A";
var FILLS = ["#5B6CF6", "#FF9F1C", "#16B79A", "#FF5D6C", "#9B5DE5"];
var EMPTY = "#FFFFFF";

function svgEl(tag, attrs) {
  var n = document.createElementNS(NS, tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function makeSVG(w, h) {
  var s = svgEl("svg", { viewBox: "0 0 " + w + " " + h, "class": "shape", width: "100%",
    preserveAspectRatio: "xMidYMid meet", role: "img" });
  s.style.maxWidth = w + "px";   /* scale down on small screens, never distort */
  return s;
}
function arcPath(cx, cy, r, a0, a1) {
  var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
  var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  var big = (a1 - a0) > Math.PI ? 1 : 0;
  return "M " + cx + " " + cy + " L " + x0.toFixed(2) + " " + y0.toFixed(2) +
    " A " + r + " " + r + " 0 " + big + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2) + " Z";
}

/* ---- one whole, split into `den` parts ---------------------------------
   filled : array of booleans (length den)
   opts   : {kind:'bar'|'circle'|'choc', color, w, h, onToggle(i), unequal:true}
------------------------------------------------------------------------ */
function wholeSVG(den, filled, opts) {
  opts = opts || {};
  var kind = opts.kind || "bar";
  var color = opts.color || FILLS[0];
  var svg, i, part;
  var clickable = typeof opts.onToggle === "function";

  function decorate(node, idx) {
    node.setAttribute("stroke", INK);
    node.setAttribute("stroke-width", "3");
    node.setAttribute("fill", filled[idx] ? color : EMPTY);
    if (clickable) {
      node.setAttribute("class", "part");
      node.setAttribute("tabindex", "0");
      node.setAttribute("role", "button");
      node.addEventListener("click", function () { opts.onToggle(idx); });
      node.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); opts.onToggle(idx); }
      });
    }
  }

  if (kind === "circle") {
    var size = opts.w || 180, r = size / 2 - 6, cx = size / 2, cy = size / 2;
    svg = makeSVG(size, size);
    for (i = 0; i < den; i++) {
      var a0 = -Math.PI / 2 + (2 * Math.PI * i) / den;
      var a1 = -Math.PI / 2 + (2 * Math.PI * (i + 1)) / den;
      part = svgEl("path", { d: arcPath(cx, cy, r, a0, a1) });
      decorate(part, i);
      svg.appendChild(part);
    }
    return svg;
  }

  if (kind === "choc") {
    /* chocolate bar: den squares in up to 2 rows */
    var cols = den <= 6 ? den : Math.ceil(den / 2);
    var rows = den <= 6 ? 1 : 2;
    var cw = 54, ch = 54, pad = 6;
    var W = cols * cw + pad * 2, H = rows * ch + pad * 2;
    svg = makeSVG(W, H);
    for (i = 0; i < den; i++) {
      var rw = Math.floor(i / cols), cl = i % cols;
      part = svgEl("rect", { x: pad + cl * cw, y: pad + rw * ch, width: cw, height: ch, rx: 7 });
      decorate(part, i);
      svg.appendChild(part);
    }
    return svg;
  }

  /* default: horizontal bar */
  var bw = opts.w || 420, bh = opts.h || 62, p = 4;
  svg = makeSVG(bw, bh + p * 2);
  var inner = bw - p * 2;
  var slice = inner / den;
  for (i = 0; i < den; i++) {
    var x = p + i * slice;
    if (opts.unequal) {                     /* deliberately unequal parts for a teaching example */
      var cuts = opts.unequal;              /* array of fractions summing to 1 */
      var acc = 0, j;
      for (j = 0; j < i; j++) acc += cuts[j];
      x = p + acc * inner;
      slice = cuts[i] * inner;
    }
    part = svgEl("rect", { x: x, y: p, width: slice, height: bh, rx: 5 });
    decorate(part, i);
    svg.appendChild(part);
  }
  return svg;
}

/* ---- a fraction num/den, drawn across as many wholes as needed ---- */
function fractionSVG(num, den, opts) {
  opts = opts || {};
  var wholes = Math.max(1, Math.ceil(num / den));
  var box = el("div", "");
  box.style.display = "flex";
  box.style.flexDirection = (opts.kind === "circle") ? "row" : "column";
  box.style.flexWrap = "wrap";
  box.style.gap = "8px";
  box.style.justifyContent = "center";
  box.style.alignItems = "center";
  var left = num;
  for (var w = 0; w < wholes; w++) {
    var filled = [];
    for (var i = 0; i < den; i++) { filled.push(left > 0); if (left > 0) left--; }
    box.appendChild(wholeSVG(den, filled, opts));
  }
  return box;
}

/* ---- interactive shading pad ---- */
function shadePad(den, state, opts) {
  opts = opts || {};
  var host = el("div", "");
  function draw() {
    FA.clear(host);
    host.appendChild(wholeSVG(den, state.filled, {
      kind: opts.kind || "bar", color: opts.color,
      onToggle: function (i) {
        state.filled[i] = !state.filled[i];
        draw();
        if (opts.onChange) opts.onChange(countTrue(state.filled));
      }
    }));
    if (opts.caption) {
      var cap = el("div", "shape-label", opts.caption(countTrue(state.filled), den));
      host.appendChild(cap);
    }
  }
  draw();
  return host;
}

function boolArr(den, n) { var a = []; for (var i = 0; i < den; i++) a.push(i < n); return a; }

/* ---- typographic fraction ---- */
function fracHTML(n, d, cls) {
  return '<span class="frac ' + (cls || "") + '"><span class="num">' + n + '</span><span class="den">' + d + "</span></span>";
}
function mixedHTML(w, n, d, cls) {
  return '<span class="mixed ' + (cls || "") + '"><span>' + w + "</span>" + fracHTML(n, d) + "</span>";
}
function fracText(n, d) { return n + "/" + d; }
function mixedText(w, n, d) { return w + " " + n + "/" + d; }

/* ---------------- option helpers ---------------- */
function fo(n, d) { return { html: fracHTML(n, d, "big"), value: n + "/" + d }; }
function to(text, value) { return { html: '<span>' + text + "</span>", value: value === undefined ? text : value }; }

function fracDistractors(n, d, count) {
  var out = [], tries = 0;
  var cands = [
    [d, n], [n + 1, d], [n - 1, d], [n, d + 1], [n, d - 1], [n + 1, d + 1], [d - n, d], [n, n + d]
  ];
  cands = shuffle(cands);
  while (out.length < count && tries < 60) {
    tries++;
    var c = cands.length ? cands.pop() : [ri(1, 9), ri(2, 10)];
    if (!c) continue;
    var a = c[0], b = c[1];
    if (a < 1 || b < 2 || a > 12 || b > 12) continue;
    if (a === n && b === d) continue;
    if (a / b === n / d) continue;          /* equivalent value would be a second correct answer */
    var key = a + "/" + b, dup = false;
    for (var i = 0; i < out.length; i++) if (out[i].value === key) dup = true;
    if (!dup) out.push(fo(a, b));
  }
  return out;
}

/* ---------------- bank builder ---------------- */
var uid = 0;
function numVal(v) {
  if (typeof v !== "string") return null;
  if (/^[0-9]+\/[0-9]+$/.test(v)) { var p2 = v.split("/"); return Number(p2[0]) / Number(p2[1]); }
  if (/^[0-9]+(\.[0-9]+)?$/.test(v)) return Number(v);
  return null;
}
/* drop any option that is a second correct answer (same value, different look) */
function sanitize(q) {
  if (q.type !== "mcq" || !q.options) return q;
  var av = numVal(q.answer), seen = {}, out = [], hasAnswer = false;
  q.options.forEach(function (o) {
    if (seen[o.value]) return;
    if (o.value === q.answer) { hasAnswer = true; }
    else if (av !== null) {
      var v = numVal(o.value);
      if (v !== null && v === av) return;
    }
    seen[o.value] = 1;
    out.push(o);
  });
  q.options = out;
  q.valid = hasAnswer && out.length >= 2;
  return q;
}
function makeQuestion(topic, level) {

  do {
    q = sanitize(GEN[topic](level || 2));
    tries++;
  } while (q.valid === false && tries < 8);
  q.id = "q" + (++uid);
  if (!q.topic) q.topic = topic;
  if (!q.level) q.level = 2;
  return q;
}
function signature(q) {
  return q.topic + "|" + q.type + "|" + FA.L(q.prompt) + "|" + JSON.stringify(q.answer);
}
function bank(topic, count, level) {
  var out = [], seen = {}, guard = 0;
  while (out.length < count && guard < count * 25) {
    guard++;
    var q = makeQuestion(topic, level);
    var s = signature(q);
    if (seen[s]) continue;
    seen[s] = 1;
    out.push(q);
  }
  return out;
}
function mixedBank(count, level) {
  var out = [], i = 0;
  var ids = shuffle(TOPICS.map(function (t) { return t.id; }));
  while (out.length < count) {
    out.push(makeQuestion(ids[i % ids.length], level));
    i++;
  }
  return shuffle(out);
}

  for (var i = 0; i < list.length; i++) if (list[i].value === opt.value) return;

  plus.onclick = function () { if (val < max) { val++; out.textContent = val; out.classList.remove("pop"); void out.offsetWidth; out.classList.add("pop"); onChange(val); } };
  row.appendChild(minus); row.appendChild(out); row.appendChild(plus);
  box.appendChild(row);
  box.style.textAlign = "center";
  return { node: box, get: function () { return val; }, set: function (v) { val = v; out.textContent = v; } };
}

/* ---------- feedback ---------- */

/* =========================================================
   renderQuestion(host, q, done)  -> done(isCorrect)
   ========================================================= */
function renderQuestion(host, q, done) {
  FA.clear(host);
  var wrap = el("div", "rise");
  host.appendChild(wrap);

  var pr = el("h3", "", L(q.prompt));
  wrap.appendChild(pr);

  var vis = el("div", "");
  wrap.appendChild(vis);
  if (q.visual) q.visual(vis);

  var body = el("div", "");
  wrap.appendChild(body);

  function finish(ok, chosen) {
    showFeedback(wrap, ok, q, chosen, function () { done(ok, chosen); });
  }

  switch (q.type) {
    case "mcq":        return renderMcq(body, q, finish);
    case "pictureMcq": return renderPictureMcq(body, q, finish);
    case "shade":      return renderShade(body, q, finish);
    case "complete":   return renderComplete(body, q, finish);
    case "classify":   return renderClassify(body, q, finish);
    case "compare":    return renderCompare(body, q, finish);
    case "order":      return renderOrder(body, q, finish);
    case "quantity":   return renderQuantity(body, q, finish);
    default:           return renderMcq(body, q, finish);
  }
}

/* ---- A. multiple choice ---- */
function renderMcq(host, q, finish) {
  var grid = el("div", "options");
  var locked = false;
  q.options.forEach(function (o) {
    var b = el("button", "opt", o.html);
    b.onclick = function () {
      if (locked) return;
      locked = true;
      var ok = o.value === q.answer;
      b.classList.add(ok ? "right" : "wrong");
      b.classList.add(ok ? "pop" : "shake");
      if (!ok) {
        Array.prototype.forEach.call(grid.children, function (c, i) {
          if (q.options[i].value === q.answer) c.classList.add("right");
        });
      }
      Array.prototype.forEach.call(grid.children, function (c) { c.disabled = true; });
      finish(ok, o.value);
    };
    grid.appendChild(b);
  });
  host.appendChild(grid);
}

/* ---- B. picture choice ---- */
function renderPictureMcq(host, q, finish) {
  var opts = q.buildOptions();
  var grid = el("div", "options");
  grid.style.gridTemplateColumns = "repeat(auto-fit,minmax(180px,1fr))";
  var locked = false;
  opts.forEach(function (o) {
    var b = el("button", "opt");
    b.style.flexDirection = "column";
    b.appendChild(o.svg());
    b.onclick = function () {
      if (locked) return;
      locked = true;
      var ok = o.value === q.answer;
      b.classList.add(ok ? "right" : "wrong");
      b.classList.add(ok ? "pop" : "shake");
      Array.prototype.forEach.call(grid.children, function (c, i) {
        c.disabled = true;
        if (opts[i].value === q.answer) c.classList.add("right");
      });
      finish(ok, o.value);
    };
    grid.appendChild(b);
  });
  host.appendChild(grid);
}

/* ---- C. shade the fraction ---- */
function renderShade(host, q, finish) {
  var d = q.data.den;
  var state = { filled: V.boolArr(d, 0) };
  host.appendChild(el("p", "", T("tapToShade")));
  var live = el("div", "shape-label", "");
  var pad = V.shadePad(d, state, {
    kind: q.data.kind,
    onChange: function (n) { live.innerHTML = L({ en: n + " of " + d + " shaded", ms: n + " daripada " + d + " dilorek" }); }
  });

  host.appendChild(live);
  var bar = actionBar("check", function () {
    var n = V.countTrue(state.filled);
    bar.btn.disabled = true;
    finish(n === q.data.target, String(n));
  });
  host.appendChild(bar);
}

/* ---- D. complete the fraction (steppers) ---- */
function renderComplete(host, q, finish) {
  var d = q.data;
  var num = 1, den = d.fixedDen || 2;
  var box = el("div", "fracbox");
  var numCtl = stepper(1, d.maxNum || 12, num, function (v) { num = v; }, T("numerator"));
  box.appendChild(numCtl.node);
  var line = el("div", "", '<span style="font-size:2rem;font-weight:800">/</span>');
  box.appendChild(line);
  if (d.missing === "both") {
    var denCtl = stepper(2, d.maxDen || 12, den, function (v) { den = v; }, T("denominator"));
    box.appendChild(denCtl.node);
  } else {
    var fixed = el("div", "");
    fixed.appendChild(el("div", "shape-label", T("denominator")));
    fixed.appendChild(el("div", "", '<div style="font-family:var(--display);font-size:1.5rem;font-weight:800;text-align:center">' + den + "</div>"));
    box.appendChild(fixed);
  }

  var bar = actionBar("check", function () {
    bar.btn.disabled = true;
    var val = num + "/" + den;

/* ---- E. classify into boxes ---- */
function renderClassify(host, q, finish) {
  var cards = q.data.cards.slice();
  var picked = null;
  var placement = {};   /* key -> boxKey */
  host.appendChild(el("p", "", T("tapCardThenBox")));
  var tray = el("div", "tray");
  var zones = el("div", "dropzones");

  function draw() {
    FA.clear(tray); FA.clear(zones);
    cards.forEach(function (c) {
      if (placement[c.key]) return;
      var t = el("button", "tile" + (picked === c.key ? " picked" : ""), V.fracHTML(c.n, c.d));
      t.onclick = function () { picked = (picked === c.key) ? null : c.key; draw(); };
      tray.appendChild(t);
    });
    q.data.boxes.forEach(function (bx) {
      var z = el("div", "zone" + (picked ? " armed" : ""));
      z.appendChild(el("h4", "", L(bx.label) + '<br><span style="font-size:.72rem;font-weight:700;color:var(--ink-soft)">' + L(bx.note) + "</span>"));
      var bin = el("div", "bin");
      cards.forEach(function (c) {
        if (placement[c.key] !== bx.key) return;
        var t = el("button", "tile placed", V.fracHTML(c.n, c.d));
        t.onclick = function () { delete placement[c.key]; picked = null; draw(); };
        bin.appendChild(t);
      });
      z.appendChild(bin);
      z.onclick = function (e) {
        if (e.target !== z && e.target.parentNode !== z && !z.contains(e.target)) return;
        if (picked) { placement[picked] = bx.key; picked = null; draw(); }
      };
      zones.appendChild(z);
    });
    check.btn.disabled = Object.keys(placement).length !== cards.length;
  }
  host.appendChild(tray);
  host.appendChild(zones);
  var check = actionBar("check", function () {
    check.btn.disabled = true;
    var ok = true;
    cards.forEach(function (c) { if (placement[c.key] !== c.box) ok = false; });
    /* mark the wrong ones */
    Array.prototype.forEach.call(zones.querySelectorAll(".tile"), function (t) { t.disabled = true; });
    if (!ok) {
      var lines = cards.filter(function (c) { return placement[c.key] !== c.box; })
        .map(function (c) { return c.n + "/" + c.d; }).join(", ");
      q.explain = {
        en: L(q.explain) + " Check these again: " + lines + ".",
        ms: L(q.explain) + " Semak semula yang ini: " + lines + "."
      };
    }
    finish(ok, "sorted");
  });
  host.appendChild(check);
  draw();
}

/* ---- F. compare with > < = ---- */
function renderCompare(host, q, finish) {
  var A = q.data.A, B = q.data.B;
  var row = el("div", "");
  var line = el("div", "fracbox");
  line.innerHTML = V.fracHTML(A[0], A[1], "big") +
    '<span id="cmpbox" style="border:3px solid var(--line);border-radius:10px;min-width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;background:#fff">?</span>' +
    V.fracHTML(B[0], B[1], "big");
  row.appendChild(line);
  row.appendChild(V.wholeSVG(A[1], V.boolArr(A[1], A[0]), { kind: "bar", w: 400, h: 38 }));
  row.appendChild(el("div", "shape-label", A[0] + "/" + A[1]));
  row.appendChild(V.wholeSVG(B[1], V.boolArr(B[1], B[0]), { kind: "bar", w: 400, h: 38, color: "#FF9F1C" }));
  row.appendChild(el("div", "shape-label", B[0] + "/" + B[1]));

  var grid = el("div", "options");
  var locked = false;
  [">", "<", "="].forEach(function (sign) {

    b.onclick = function () {

      var boxEl = line.querySelector("#cmpbox");
      if (boxEl) boxEl.textContent = q.answer;
      Array.prototype.forEach.call(grid.children, function (c) { c.disabled = true; });
      finish(ok, sign);
    };
    grid.appendChild(b);
  });

}

/* ---- G. order the fractions ---- */
function renderOrder(host, q, finish) {
  var list = q.data.cards.slice();
  var picked = -1;
  host.appendChild(el("p", "", T("tapTwoSwap")));
  var arrow = el("div", "shape-label", q.data.dir === "asc" ? T("smallToBig") + " →" : T("bigToSmall") + " →");
  host.appendChild(arrow);
  var row = el("div", "orderrow");
  host.appendChild(row);

  function draw() {
    FA.clear(row);
    list.forEach(function (c, i) {
      var card = el("div", "ordercard" + (picked === i ? " picked" : ""));
      var tap = el("button", "tile", V.fracHTML(c[0], c[1], "big"));
      tap.style.boxShadow = "none"; tap.style.border = "none"; tap.style.background = "transparent";
      tap.onclick = function () {
        if (picked === -1) { picked = i; }
        else if (picked === i) { picked = -1; }
        else { var t = list[picked]; list[picked] = list[i]; list[i] = t; picked = -1; }
        draw();
      };
      card.appendChild(tap);
      if (q.data.showBars) {
        var mini = V.wholeSVG(c[1], V.boolArr(c[1], c[0]), { kind: "bar", w: 120, h: 26 });
        mini.style.maxHeight = "34px";
        card.appendChild(mini);
      }
      var mv = el("div", "mini-move");
      var lft = el("button", "", "◀"); lft.setAttribute("aria-label", "move left");
      var rgt = el("button", "", "▶"); rgt.setAttribute("aria-label", "move right");
      lft.disabled = i === 0; rgt.disabled = i === list.length - 1;
      lft.onclick = function () { var t = list[i - 1]; list[i - 1] = list[i]; list[i] = t; picked = -1; draw(); };
      rgt.onclick = function () { var t = list[i + 1]; list[i + 1] = list[i]; list[i] = t; picked = -1; draw(); };
      mv.appendChild(lft); mv.appendChild(rgt);
      card.appendChild(mv);
      row.appendChild(card);
    });
  }
  draw();
  var bar = actionBar("check", function () {
    bar.btn.disabled = true;
    var given = list.map(function (c) { return c[0] + "/" + c[1]; }).join(",");
    Array.prototype.forEach.call(row.querySelectorAll("button"), function (b) { b.disabled = true; });
    finish(given === q.answer, given);
  });
  host.appendChild(bar);
}

/* ---- H. fraction of a quantity (share into groups) ---- */
function renderQuantity(host, q, finish) {
  var d = q.data.den, total = q.data.total, emoji = q.data.emoji;
  var shared = false, selected = {};
  var per = total / d;

  host.appendChild(el("p", "", L({
    en: "Step 1: share the " + total + " items into " + d + " equal groups. Step 2: choose " + q.data.num + " group" + (q.data.num > 1 ? "s" : "") + ". Step 3: set your answer.",
    ms: "Langkah 1: bahagikan " + total + " item kepada " + d + " kumpulan sama banyak. Langkah 2: pilih " + q.data.num + " kumpulan. Langkah 3: tetapkan jawapan kamu."
  })));

  var tray = V.itemRow(total, emoji);
  host.appendChild(tray);
  var groups = el("div", "groupgrid");
  host.appendChild(groups);
  var count = el("div", "shape-label", "");

  function drawGroups() {
    FA.clear(groups);
    for (var g = 0; g < d; g++) {
      (function (gi) {
        var b = el("div", "groupbox");
        if (selected[gi]) { b.style.background = "#FFF0CC"; b.style.borderStyle = "solid"; }
        if (shared) for (var k = 0; k < per; k++) b.appendChild(el("span", "", emoji));
        b.onclick = function () {
          if (!shared) return;
          selected[gi] = !selected[gi];
          var c = 0; for (var z in selected) if (selected[z]) c++;
          count.innerHTML = L({ en: c + " group(s) selected = " + (c * per) + " items", ms: c + " kumpulan dipilih = " + (c * per) + " item" });
          drawGroups();
        };
        groups.appendChild(b);
      })(g);
    }
  }
  drawGroups();
  host.appendChild(count);

  var shareBtn = el("button", "btn warn", L({ en: "Share equally", ms: "Bahagi sama rata" }));
  shareBtn.onclick = function () {
    shared = true;
    Array.prototype.forEach.call(tray.children, function (c) { c.classList.add("used"); });
    drawGroups();
    shareBtn.disabled = true;
    count.innerHTML = L({ en: "Each group has " + per + ".", ms: "Setiap kumpulan ada " + per + "." });
  };
  var sRow = el("div", "btn-row"); sRow.appendChild(shareBtn);
  host.appendChild(sRow);

  var ansCtl = stepper(0, total, 0, function () {}, L({ en: "My answer", ms: "Jawapan saya" }));
  host.appendChild(ansCtl.node);
  var bar = actionBar("check", function () {
    bar.btn.disabled = true;
    var v = String(ansCtl.get());
    finish(v === q.answer, v);
  });
  host.appendChild(bar);
}

window.FA.widgets = { renderQuestion: renderQuestion, stepper: stepper, actionBar: actionBar };

/* 7 & 11 — repeatable sandbox question */
function sandbox(topic, level) {
  return function (host) {
    var slot = el("div", "");
    host.appendChild(slot);

      W.renderQuestion(slot, FA.bankAPI.makeQuestion(topic, level), function () {

/* 8 — quantity splitter */
SEE.qtyPlay = function (host) {
  var d = 3, per = 4, n = 1;
  var emoji = "🍎";
  var pic = el("div", ""), read = el("div", "");
  function refresh() {
    FA.clear(pic); FA.clear(read);
    var total = d * per;
    pic.appendChild(V.itemRow(total, emoji));
    var g = el("div", "groupgrid");
    for (var i = 0; i < d; i++) {
      var b = el("div", "groupbox");
      if (i < n) { b.style.background = "#FFF0CC"; b.style.borderStyle = "solid"; }
      for (var k = 0; k < per; k++) b.appendChild(el("span", "", emoji));
      g.appendChild(b);
    }
    pic.appendChild(g);
    read.innerHTML = '<div class="callout tip"><strong>' + n + "/" + d + " " + L({ en: "of", ms: "daripada" }) + " " + total +
      " = " + (per * n) + "</strong><br>" + L({ en: total + " ÷ " + d + " = " + per + " in each group, then " + per + " × " + n + " = " + (per * n) + ".",
                                                ms: total + " ÷ " + d + " = " + per + " dalam setiap kumpulan, kemudian " + per + " × " + n + " = " + (per * n) + "." }) + "</div>";
  }
  var ctl = el("div", "fracbox");
  ctl.appendChild(W.stepper(2, 6, d, function (v) { d = v; if (n > d) n = d; refresh(); }, L({ en: "Equal groups", ms: "Kumpulan sama" })).node);
  ctl.appendChild(W.stepper(1, 6, per, function (v) { per = v; refresh(); }, L({ en: "In each group", ms: "Dalam setiap kumpulan" })).node);
  ctl.appendChild(W.stepper(1, 6, n, function (v) { n = Math.min(v, d); refresh(); }, L({ en: "Groups taken", ms: "Kumpulan diambil" })).node);
  host.appendChild(ctl); host.appendChild(pic); host.appendChild(read);
  refresh();
};

/* 9 / 10 — add & subtract sandbox */
function opPlay(isAdd) {
  return function (host) {
    var d = 5, a = 1, b = 2;
    var pic = el("div", ""), read = el("div", "fracbox");
    function refresh() {
      if (isAdd && a + b > d) b = d - a;
      if (!isAdd && b > a) b = a;
      FA.clear(pic); FA.clear(read);
      pic.appendChild(V.wholeSVG(d, V.boolArr(d, a), { kind: "bar", w: 420, h: 40 }));
      pic.appendChild(liveLabel(a + "/" + d));
      pic.appendChild(V.wholeSVG(d, V.boolArr(d, b), { kind: "bar", w: 420, h: 40, color: "#FF9F1C" }));
      pic.appendChild(liveLabel((isAdd ? "+ " : "− ") + b + "/" + d));
      var r = isAdd ? a + b : a - b;
      pic.appendChild(V.wholeSVG(d, V.boolArr(d, r), { kind: "bar", w: 420, h: 40, color: "#16B79A" }));
      pic.appendChild(liveLabel("= " + r + "/" + d));
      read.innerHTML = V.fracHTML(a, d, "big") + '<span style="font-size:1.8rem;font-weight:800">' + (isAdd ? "+" : "−") + "</span>" +
        V.fracHTML(b, d, "big") + '<span style="font-size:1.8rem;font-weight:800">=</span>' + V.fracHTML(r, d, "big");
    }
    var ctl = el("div", "fracbox");
    ctl.appendChild(W.stepper(1, 9, a, function (v) { a = Math.min(v, d); refresh(); }, L({ en: "First numerator", ms: "Pengangka pertama" })).node);
    ctl.appendChild(W.stepper(1, 9, b, function (v) { b = v; refresh(); }, L({ en: "Second numerator", ms: "Pengangka kedua" })).node);
    ctl.appendChild(W.stepper(2, 10, d, function (v) { d = v; if (a > d) a = d; refresh(); }, L({ en: "Same denominator", ms: "Penyebut yang sama" })).node);
    host.appendChild(ctl); host.appendChild(pic); host.appendChild(read);
    host.appendChild(el("div", "callout tip", L(isAdd
      ? { en: "The denominator never changes. Only the numerators are added.", ms: "Penyebut tidak pernah berubah. Hanya pengangka ditambah." }
      : { en: "The denominator never changes. Only the numerators are subtracted.", ms: "Penyebut tidak pernah berubah. Hanya pengangka ditolak." })));
    refresh();
  };
}

/* 11 — guided word problem walkthrough */
SEE.wordPlay = function (host) {
  var d = 4, per = 3, total = d * per, name = FA.pick(["Aiman", "Nurul", "Mei Ling", "Danish"]);

  })));
  var steps = [
    { q: { en: "Step 1 — What is the whole?", ms: "Langkah 1 — Apakah keseluruhannya?" },
      a: { en: "The whole is all " + total + " sweets.", ms: "Keseluruhannya ialah kesemua " + total + " biji gula-gula." } },
    { q: { en: "Step 2 — What does the denominator tell us?", ms: "Langkah 2 — Apakah yang diberitahu oleh penyebut?" },
      a: { en: "Share the sweets into " + d + " equal groups: " + total + " ÷ " + d + " = " + per + ".", ms: "Bahagikan gula-gula kepada " + d + " kumpulan sama banyak: " + total + " ÷ " + d + " = " + per + "." } },
    { q: { en: "Step 3 — What does the numerator tell us?", ms: "Langkah 3 — Apakah yang diberitahu oleh pengangka?" },
      a: { en: "Take 1 group, so the answer is " + per + " sweets.", ms: "Ambil 1 kumpulan, jadi jawapannya ialah " + per + " biji gula-gula." } }

  steps.forEach(function (s) {
    var box = el("div", "card flat");
    box.style.margin = "10px 0";
    box.appendChild(el("strong", "", L(s.q)));
    var ansEl = el("p", "");

    box.appendChild(b); box.appendChild(ansEl);
    host.appendChild(box);
  });
  host.appendChild(V.itemRow(total, "🍬"));
};

/* ---------- helpers ---------- */
function toast(msg) {
  var t = FA.$("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function () { t.classList.remove("show"); }, 2200);
}
function starsFor(id) { return (S.modules[id] && S.modules[id].stars) || 0; }
function isDone(id) { return !!(S.modules[id] && S.modules[id].done); }
function unlocked(i) { return i === 0 || isDone(LESSONS[i - 1].id); }
function doneCount() { var c = 0; LESSONS.forEach(function (l) { if (isDone(l.id)) c++; }); return c; }
function nextLessonIndex() {
  for (var i = 0; i < LESSONS.length; i++) if (!isDone(LESSONS[i].id)) return i;
  return -1;
}
function totalStars() {
  var s = 0;
  LESSONS.forEach(function (l) { s += starsFor(l.id); });
  if (S.finalBest) s += Math.round(S.finalBest.pct / 20);
  return s;
}
function starRow(n, max) {
  var out = "";
  for (var i = 0; i < (max || 3); i++) out += i < n ? "⭐" : "☆";
  return out;
}
function topicAccuracy(id) {
  var t = S.topics[id];
  if (!t || !t.total) return null;
  return Math.round((t.correct / t.total) * 100);
}
function weakTopics() {
  var out = [];
  B.TOPICS.forEach(function (t) {
    var st = S.topics[t.id];
    if (st && st.total >= 3) {
      var acc = st.correct / st.total;
      if (acc < 0.7) out.push({ id: t.id, acc: Math.round(acc * 100) });
    }
  });
  out.sort(function (a, b) { return a.acc - b.acc; });
  return out;
}
function recordAnswer(topic, ok) {
  if (!S.topics[topic]) S.topics[topic] = { correct: 0, total: 0 };

}

/* ---------- progress map ---------- */
function buildMap(preview) {
  var wrapper = el("div", "map");
  var start = nextLessonIndex();
  var from = 0, to = LESSONS.length;
  if (preview) { from = Math.max(0, (start === -1 ? LESSONS.length - 3 : start) - 1); to = Math.min(LESSONS.length, from + 3); }
  for (var i = from; i < to; i++) {
    (function (i) {
      var l = LESSONS[i];
      var open = unlocked(i), done = isDone(l.id);
      var node = el("div", "map-node");
      var rail = el("div", "map-rail");
      var dot = el("div", "map-dot " + (done ? "done" : (open ? "now" : "lock")), done ? "✓" : (open ? String(i + 1) : "🔒"));
      rail.appendChild(dot);
      if (i < to - 1) rail.appendChild(el("div", "map-line"));
      node.appendChild(rail);
      var item = el(open ? "button" : "div", "map-item" + (open ? "" : " locked"));
      item.innerHTML = '<span class="ico">' + l.icon + '</span>';
      var txt = el("div", "");
      txt.style.flex = "1";
      txt.appendChild(el("div", "mt", L(l.title)));
      txt.appendChild(el("div", "ms", open ? (done ? T("review") : T("goLesson")) : T("locked")));
      item.appendChild(txt);
      item.appendChild(el("div", "stars-mini", starRow(starsFor(l.id))));
      if (open) item.onclick = function () { go("lesson", { id: l.id }); };
      else item.onclick = function () { toast(T("lockedMsg")); };
      node.appendChild(item);
      wrapper.appendChild(node);
    })(i);
  }
  return wrapper;
}

/* ---------- lesson viewer ---------- */
ROUTES.lesson = function (p) {
  var idx = 0;
  for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].id === p.id) idx = i;
  var l = LESSONS[idx];
  if (!unlocked(idx)) { toast(T("lockedMsg")); return go("map"); }

  var stepKeys = ["stepDiscover", "stepExplain", "stepSee", "stepTry", "stepPractise", "stepQuiz", "stepReward"];
  var step = 0, quizScore = 0;

  var card = el("div", "card");
  var head = el("div", "");
  head.innerHTML = '<span class="pill">' + T("lessons") + " " + (idx + 1) + "/" + LESSONS.length + "</span>";
  card.appendChild(head);
  card.appendChild(el("h2", "", l.icon + " " + L(l.title)));
  var chips = el("div", "steps");
  card.appendChild(chips);
  var body = el("div", "");
  card.appendChild(body);
  main.appendChild(card);
  main.appendChild(backBar("map", T("lessons")));

  function drawChips() {
    FA.clear(chips);
    stepKeys.forEach(function (k, i) {
      chips.appendChild(el("span", "step-chip " + (i === step ? "on" : (i < step ? "done" : "")), T(k)));
    });
  }
  function nextBtn(labelKey, fn) {
    var bar = el("div", "sticky-actions");
    var row = el("div", "btn-row end");
    var b = el("button", "btn primary", T(labelKey || "next"));
    b.onclick = fn || function () { step++; draw(); };
    row.appendChild(b); bar.appendChild(row);
    return bar;
  }

  function draw() {
    drawChips();
    FA.clear(body);
    var box = el("div", "rise");
    body.appendChild(box);

    if (step === 0) {
      box.appendChild(el("h3", "", "🔎 " + T("whatNotice")));
      box.appendChild(el("p", "", L(l.discover)));
      if (l.discoverVisual) l.discoverVisual(box);
      box.appendChild(nextBtn("next"));
      return;
    }
    if (step === 1) {
      box.appendChild(el("h3", "", "💡 " + T("stepExplain")));
      box.appendChild(FA.lessons.bullets(l.explain));
      box.appendChild(nextBtn("next"));
      return;
    }
    if (step === 2) {
      box.appendChild(el("h3", "", "🎛️ " + T("seeItTitle")));
      var play = el("div", "");
      box.appendChild(play);
      l.see(play);
      box.appendChild(nextBtn("next"));
      return;
    }
    if (step === 3) {
      box.appendChild(el("h3", "", "✏️ " + T("tryItTitle")));
      var slot = el("div", "");
      box.appendChild(slot);
      W.renderQuestion(slot, B.makeQuestion(l.topic, 1), function (ok) {
        recordAnswer(l.topic, ok);
        slot.appendChild(nextBtn("next"));
      });
      return;
    }
    if (step === 4) {
      box.appendChild(el("h3", "", "🏋️ " + T("practiseTitle")));
      var slot2 = el("div", "");
      box.appendChild(slot2);
      FA.quiz.sequence(slot2, B.bank(l.topic, 5, 2), l.topic, function () {
        slot2.appendChild(nextBtn("next"));
      });
      return;
    }
    if (step === 5) {
      box.appendChild(el("h3", "", "🏁 " + T("miniQuizTitle")));
      var slot3 = el("div", "");
      box.appendChild(slot3);
      FA.quiz.sequence(slot3, B.bank(l.topic, 5, 3), l.topic, function (score) {
        quizScore = score;
        slot3.appendChild(nextBtn("next"));
      });
      return;
    }
    /* reward */
    var stars = quizScore >= 5 ? 3 : (quizScore >= 4 ? 2 : (quizScore >= 3 ? 1 : 0));
    var prev = S.modules[l.id] || { stars: 0 };
    S.modules[l.id] = { done: true, stars: Math.max(prev.stars || 0, stars), best: Math.max(prev.best || 0, quizScore) };
    FA.quiz.checkBadges();
    FA.save();
    box.appendChild(el("div", "starburst", starRow(stars)));
    box.appendChild(el("h2", "", "🎉 " + T("lessonDone")));
    box.appendChild(el("p", "", T("starsEarned", { n: stars }) + " " + T("yourScore") + ": " + quizScore + "/5."));
    if (idx + 1 < LESSONS.length) {
      box.appendChild(el("p", "", "🔓 " + T("unlockedNext", { t: L(LESSONS[idx + 1].title) })));
    }
    var row = el("div", "btn-row");
    if (idx + 1 < LESSONS.length) {
      var nb = el("button", "btn go", L(LESSONS[idx + 1].title) + " →");
      nb.onclick = function () { go("lesson", { id: LESSONS[idx + 1].id }); };
      row.appendChild(nb);
    } else {
      var fb = el("button", "btn go", T("finalChallenge"));
      fb.onclick = function () { FA.quiz.runFinal(); };
      row.appendChild(fb);
    }
    var hb = el("button", "btn", T("home"));
    hb.onclick = function () { go("home"); };
    row.appendChild(hb);
    box.appendChild(row);
  }
  draw();
};

  main.appendChild(backBar("home", T("home")));
};

/* ---------- quiz hub ---------- */
ROUTES.quizhub = function () {
  var card = el("div", "card");
  card.appendChild(el("h2", "", "🏁 " + T("quizTitle")));
  var grid = el("div", "menu-grid");

    b.onclick = fn;
    grid.appendChild(b);
  }
  tile("t1", "⚡", T("quickQuiz"), T("quickQuizD"), function () {
    FA.quiz.run({ title: T("quickQuiz"), questions: B.mixedBank(10, 2), back: "quizhub" });
  });
  tile("t2", "📝", T("practiceTest"), T("practiceTestD"), function () {
    FA.quiz.run({ title: T("practiceTest"), questions: B.mixedBank(20, 2), back: "quizhub" });
  });
  tile("t3", "🔥", T("challenge"), T("challengeD"), function () {
    FA.quiz.run({ title: T("challenge"), questions: B.mixedBank(10, 3), back: "quizhub" });
  });
  tile("t4", "🎲", T("mixedQuiz"), T("mixedQuizD"), function () {

  fin.appendChild(el("p", "", doneCount() === LESSONS.length ? T("finalChallengeD") : T("finalLocked")));
  if (S.finalBest) fin.appendChild(el("p", "", T("bestScore", { p: S.finalBest.pct })));
  if (doneCount() === LESSONS.length) {
    var r = el("div", "btn-row");
    var b = el("button", "btn primary", T("start"));
    b.onclick = function () { FA.quiz.runFinal(); };
    r.appendChild(b);
    fin.appendChild(r);
  }
  card.appendChild(fin);
  main.appendChild(card);
  main.appendChild(backBar("home", T("home")));

ROUTES.topicpick = function () {
  var card = el("div", "card");
  card.appendChild(el("h2", "", T("chooseTopic")));
  var grid = el("div", "menu-grid");
  B.TOPICS.forEach(function (t, i) {
    var b = el("button", "menu-tile t" + ((i % 5) + 1));
    b.innerHTML = '<span class="ico">' + t.icon + '</span><span class="ttl">' + L(t.name) + "</span>";
    b.onclick = function () { FA.quiz.run({ title: L(t.name), questions: B.bank(t.id, 10, 2), back: "quizhub" }); };
    grid.appendChild(b);
  });
  card.appendChild(grid);
  main.appendChild(card);
  main.appendChild(backBar("quizhub", T("quizTitle")));
};

/* ---------- progress ---------- */
ROUTES.progress = function () {
  var card = el("div", "card");
  card.appendChild(el("h2", "", "📈 " + T("mProgress")));
  card.appendChild(el("p", "", "⭐ " + T("myStars") + ": <strong>" + totalStars() + "</strong>"));
  var pct = Math.round((doneCount() / LESSONS.length) * 100);
  var pb = el("div", "progressbar");
  pb.innerHTML = '<i style="width:' + pct + '%"></i>';
  card.appendChild(pb);
  card.appendChild(el("div", "shape-label", doneCount() + "/" + LESSONS.length + " " + T("lessons")));

  card.appendChild(el("h3", "", T("topicScores")));
  var ul = el("ul", "tlist");
  B.TOPICS.forEach(function (t) {
    var acc = topicAccuracy(t.id);
    var li = el("li", "");
    li.innerHTML = '<span style="min-width:26px">' + t.icon + "</span><span style='flex:1;min-width:120px'>" + L(t.name) + "</span>";
    var bar = el("div", "bar-stat");
    bar.innerHTML = '<i style="width:' + (acc === null ? 0 : acc) + '%;background:' + (acc === null ? "#ccc" : (acc >= 80 ? "#16B79A" : (acc >= 60 ? "#FF9F1C" : "#FF5D6C"))) + '"></i>';
    li.appendChild(bar);
    li.appendChild(el("span", "", '<span style="min-width:46px;display:inline-block;text-align:right">' + (acc === null ? "–" : acc + "%") + "</span>"));
    ul.appendChild(li);
  });
  card.appendChild(ul);

  card.appendChild(el("h3", "", "🏅 " + T("badgesT")));
  var bg = el("div", "badge-grid");
  FA.quiz.BADGES.forEach(function (b) {
    var got = !!S.badges[b.id];
    var n = el("div", "badge" + (got ? "" : " off"));
    n.innerHTML = '<span class="bi">' + b.icon + "</span>" + L(b.name) + '<br><span style="font-weight:600;color:var(--ink-soft)">' + L(b.how) + "</span>";
    bg.appendChild(n);
  });
  card.appendChild(bg);

  if (S.finalBest) {
    card.appendChild(el("p", "", "🏆 " + T("finalChallenge") + " — " + T("bestScore", { p: S.finalBest.pct })));
  }
  var row = el("div", "btn-row");
  var rb = el("button", "btn", T("resetAll"));
  rb.onclick = function () {
    if (window.confirm(T("resetSure"))) {
      FA.store.del(FA.KEY);
      S.profile = null; S.modules = {}; S.topics = {}; S.badges = {}; S.stars = 0; S.finalBest = null;
      FA.save();
      go("setup");
    }
  };
  row.appendChild(rb);
  card.appendChild(row);
  main.appendChild(card);
  main.appendChild(backBar("home", T("home")));
};

/* ---------- boot ---------- */
function boot() {
  header = FA.$("#topbar");
  main = FA.$("#main");
  FA.load();
  renderHeader();
  go(S.profile ? "home" : "setup");
}

window.FA.nav = { go: go, toast: toast, recordAnswer: recordAnswer, boot: boot, backBar: backBar,
  starRow: starRow, doneCount: doneCount, totalStars: totalStars, topicAccuracy: topicAccuracy,
  weakTopics: weakTopics, LESSON_COUNT: LESSONS.length, getMain: function () { return main; } };
})();

/* =========================================================
   Quiz engine, results, badges, final assessment
   ========================================================= */
(function () {
"use strict";
var FA = window.FA, S = FA.S, el = FA.el, T = FA.T, L = FA.L, W = FA.widgets, B = FA.bankAPI;

/* ---------------- badges ---------------- */
var BADGES = [
  { id: "beginner", icon: "🌱", name: { en: "Fraction Beginner", ms: "Pemula Pecahan" },
    how: { en: "Finish lesson 1", ms: "Selesaikan pelajaran 1" },
    test: function () { return !!(S.modules.m1 && S.modules.m1.done); } },
  { id: "explorer", icon: "🧭", name: { en: "Fraction Explorer", ms: "Peneroka Pecahan" },
    how: { en: "Finish 4 lessons", ms: "Selesaikan 4 pelajaran" },
    test: function () { return FA.nav.doneCount() >= 4; } },
  { id: "equivhero", icon: "🟰", name: { en: "Equivalent Fraction Hero", ms: "Wira Pecahan Setara" },
    how: { en: "80% on equivalent fractions", ms: "80% dalam pecahan setara" },
    test: function () { var a = FA.nav.topicAccuracy("equiv"); return a !== null && a >= 80 && S.topics.equiv.total >= 5; } },
  { id: "solver", icon: "🧠", name: { en: "Fraction Problem Solver", ms: "Penyelesai Masalah Pecahan" },
    how: { en: "Finish the word problem lesson", ms: "Selesaikan pelajaran masalah berayat" },
    test: function () { return !!(S.modules.m11 && S.modules.m11.done); } },
  { id: "steady", icon: "🎯", name: { en: "Sharp Shooter", ms: "Penembak Tepat" },
    how: { en: "Score 10/10 in any quiz", ms: "Dapat 10/10 dalam mana-mana kuiz" },
    test: function () { return !!S.badges.steady; } },
  { id: "master", icon: "🏆", name: { en: "Fraction Master", ms: "Jaguh Pecahan" },
    how: { en: "80% in the Master Challenge", ms: "80% dalam Cabaran Jaguh" },
    test: function () { return !!(S.finalBest && S.finalBest.pct >= 80); } }
];
function checkBadges() {
  var newOnes = [];
  BADGES.forEach(function (b) {
    if (!S.badges[b.id] && b.test()) { S.badges[b.id] = true; newOnes.push(b); }
  });
  if (newOnes.length) {
    FA.save();
    FA.nav.toast("🏅 " + L(newOnes[0].name));
  }
  return newOnes;
}

/* ---------------- question sequence ---------------- */
/* host, questions, topicTag(null = use each question's topic), done(score) */
function sequence(host, questions, topicTag, done) {
  var idx = 0, score = 0, marks = [];
  var dots = el("div", "qdots");
  var headline = el("div", "qhead");
  var slot = el("div", "");
  headline.appendChild(el("strong", "hdtext", ""));
  headline.appendChild(dots);
  host.appendChild(headline);
  host.appendChild(slot);

  function drawDots() {
    FA.clear(dots);
    for (var i = 0; i < questions.length; i++) {
      dots.appendChild(el("span", "qdot " + (marks[i] === true ? "ok" : (marks[i] === false ? "no" : (i === idx ? "now" : "")))));
    }
    headline.querySelector(".hdtext").textContent = T("question", { n: Math.min(idx + 1, questions.length), t: questions.length });
  }
  function step() {
    if (idx >= questions.length) { done(score, marks, questions); return; }
    drawDots();
    var q = questions[idx];
    W.renderQuestion(slot, q, function (ok) {
      marks[idx] = ok;
      if (ok) score++;
      FA.nav.recordAnswer(topicTag || q.topic, ok);
      idx++;
      drawDots();
      step();
    });
  }
  step();
}

/* ---------------- full-screen quiz ---------------- */
function run(opts) {
  var main = FA.nav.getMain();
  FA.clear(main);
  window.scrollTo({ top: 0 });
  var card = el("div", "card");
  card.appendChild(el("h2", "", "🏁 " + opts.title));
  var slot = el("div", "");
  card.appendChild(slot);
  main.appendChild(card);
  main.appendChild(FA.nav.backBar(opts.back || "home"));
  sequence(slot, opts.questions, null, function (score, marks, qs) {
    if (score === qs.length && qs.length >= 10) { S.badges.steady = true; }
    checkBadges();
    FA.save();
    results({ title: opts.title, score: score, marks: marks, questions: qs,
              back: opts.back, replay: opts.replay, isFinal: !!opts.isFinal });
  });
}

/* ---------------- final assessment ---------------- */
function runFinal() {
  var qs = [];
  var ids = B.TOPICS.map(function (t) { return t.id; });
  ids.forEach(function (id) { qs.push(B.makeQuestion(id, 2)); });
  var extras = FA.shuffle(ids).slice(0, 9);
  extras.forEach(function (id) { qs.push(B.makeQuestion(id, 3)); });
  run({
    title: T("finalChallenge"),
    questions: FA.shuffle(qs),
    back: "quizhub",
    isFinal: true,
    replay: runFinal
  });
}

/* ---------------- results ---------------- */
function results(o) {
  var main = FA.nav.getMain();
  FA.clear(main);
  window.scrollTo({ top: 0 });
  var pct = Math.round((o.score / o.questions.length) * 100);

  /* per-topic breakdown for this quiz */
  var byTopic = {};
  o.questions.forEach(function (q, i) {
    if (!byTopic[q.topic]) byTopic[q.topic] = { c: 0, t: 0 };
    byTopic[q.topic].t++;
    if (o.marks[i]) byTopic[q.topic].c++;
  });
  var strong = [], weak = [];
  for (var k in byTopic) {
    var r = byTopic[k].c / byTopic[k].t;
    if (r >= 0.8) strong.push(k); else if (r < 0.6) weak.push(k);
  }

  if (o.isFinal) {
    var prev = S.finalBest;
    if (!prev || pct > prev.pct) S.finalBest = { score: o.score, total: o.questions.length, pct: pct };
    checkBadges();
    FA.save();
  }

  var card = el("div", "card");
  card.appendChild(el("h2", "", (pct >= 80 ? "🌟 " : "📋 ") + o.title));
  var ring = el("div", "score-ring");
  ring.style.setProperty("--pct", pct + "%");
  ring.innerHTML = "<b>" + o.score + "/" + o.questions.length + "</b>";
  card.appendChild(ring);
  card.appendChild(el("h3", "", '<div style="text-align:center">' + T("accuracy") + ": " + pct + "%</div>"));
  card.appendChild(el("p", "", '<div style="text-align:center;font-weight:700">' +
    (pct >= 80 ? T("praise3") : (pct >= 60 ? T("praise2") : T("praise1"))) + "</div>"));

  if (o.isFinal) {
    card.appendChild(el("div", "callout", "<strong>" + (pct >= 80 ? "🏆 " + T("masterYes") : "💪 " + T("masterNo")) + "</strong>"));
  }

  if (strong.length) {
    card.appendChild(el("h3", "", "✅ " + T("strongAt")));
    var ul1 = el("ul", "tlist");
    strong.forEach(function (t) { ul1.appendChild(el("li", "", "✓ " + B.topicName(t))); });
    card.appendChild(ul1);
  }
  if (weak.length) {
    card.appendChild(el("h3", "", "🎯 " + T("keepPractising")));
    var ul2 = el("ul", "tlist");
    weak.forEach(function (t) {
      var li = el("li", "", "→ " + B.topicName(t));
      var b = el("button", "btn");
      b.style.padding = "6px 12px"; b.style.minHeight = "38px";
      b.textContent = T("stepPractise");
      b.onclick = function () { run({ title: B.topicName(t), questions: B.bank(t, 6, 2), back: o.back || "home" }); };
      li.appendChild(b);
      ul2.appendChild(li);
    });
    card.appendChild(ul2);
  }

  var row = el("div", "btn-row");
  var again = el("button", "btn go", T("again"));
  again.onclick = function () {
    if (o.replay) { o.replay(); }
    else {
      var fresh = o.questions.map(function (q) { return B.makeQuestion(q.topic, q.level); });
      run({ title: o.title, questions: fresh, back: o.back });
    }
  };
  row.appendChild(again);
  var hb = el("button", "btn", T("home"));
  hb.onclick = function () { FA.nav.go("home"); };
  row.appendChild(hb);
  card.appendChild(row);
  main.appendChild(card);
  main.appendChild(FA.nav.backBar(o.back || "home"));
}

window.FA.quiz = { sequence: sequence, run: run, runFinal: runFinal, results: results, BADGES: BADGES, checkBadges: checkBadges };

/* ---------------- start ---------------- */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", FA.nav.boot);
else FA.nav.boot();
})();

</script>
